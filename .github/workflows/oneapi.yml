name: OneAPI Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（对齐上游 songquanpeng/one-api）'
        required: true
        default: 'v0.6.10'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }

      # 缓存 gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-oneapi-${{ hashFiles('oneapi/apk/**/gradle-wrapper.properties', 'oneapi/apk/**/build.gradle') }}

      # 缓存上游二进制（按版本号缓存，不重复下载）
      - name: Cache upstream binary
        uses: actions/cache@v4
        with:
          path: oneapi/apk/app/src/main/jniLibs/arm64-v8a/liboneapi.so
          key: oneapi-bin-${{ github.event.inputs.version }}

      - name: Fetch official binary
        working-directory: oneapi/apk
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          [ -f app/src/main/jniLibs/arm64-v8a/liboneapi.so ] || {
            curl -fL --retry 3 -o app/src/main/jniLibs/arm64-v8a/liboneapi.so \
              "https://github.com/songquanpeng/one-api/releases/download/${{ github.event.inputs.version }}/one-api-arm64"
          }
          python3 align_fix.py app/src/main/jniLibs/arm64-v8a/liboneapi.so

      - name: Build APK
        working-directory: oneapi/apk
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp oneapi/apk/app/build/outputs/apk/release/*.apk "OneAPI-${{ github.event.inputs.version }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="oneapi-${VERSION}"
          gh release create "$TAG" "OneAPI-${VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OneAPI ${VERSION}" \
            --notes "OneAPI 安卓壳。上游 songquanpeng/one-api ${VERSION}。" \
            || gh release upload "$TAG" "OneAPI-${VERSION}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
