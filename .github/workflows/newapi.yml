name: NewAPI Build (APK + Termux)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['newapi/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      # Android SDK preinstalled on ubuntu-latest runners
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: oven-sh/setup-bun@v2

      - name: Build static binary -> APK payload
        run: |
          (cd newapi && ./scripts/build-from-upstream.sh)
      - name: Build APK
        working-directory: newapi/apk
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp newapi/apk/app/build/outputs/apk/debug/app-debug.apk NewAPI-v1.0.0-rc.15.apk

      - name: Build Termux tarball
        working-directory: newapi/termux
        run: ./build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NewAPI
          path: |
            NewAPI-v1.0.0-rc.15.apk
            newapi/newapi-termux-arm64.tar.gz
