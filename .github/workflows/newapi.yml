name: NewAPI Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（对齐上游 newapi）'
        required: true
        default: 'v1.0.0-rc.15'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true                     # 缓存 go modules
      - uses: oven-sh/setup-bun@v2        # setup-bun 自带缓存

      # 缓存 gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-newapi-${{ hashFiles('newapi/apk/**/gradle-wrapper.properties', 'newapi/apk/**/build.gradle') }}

      - name: Build static binary from upstream
        run: (cd newapi && ./scripts/build-from-upstream.sh)

      - name: Build APK
        working-directory: newapi/apk
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp newapi/apk/app/build/outputs/apk/release/*.apk "NewAPI-${{ github.event.inputs.version }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="newapi-${VERSION}"
          gh release create "$TAG" "NewAPI-${VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NewAPI ${VERSION}" \
            --notes "NewAPI 安卓壳（static arm64）。上游 ${VERSION}。" \
            || gh release upload "$TAG" "NewAPI-${VERSION}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
