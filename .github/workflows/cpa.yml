name: CPA Build (APK + Termux)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['cpa/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - # Android SDK preinstalled on ubuntu-latest runners
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x' }
      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with: { ndk-version: r27c }

      # --- APK: NDK/Bionic cross-compiled binary + Java shell ---
      - name: Build APK
        working-directory: cpa/apk
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_CC: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: ./build-apk.sh
      - name: Rename APK
        run: cp cpa/apk/CPA-v*.apk CPA-v8.0.79.apk

      # --- Termux: official static no-plugin tarball ---
      - name: Build Termux tarball
        working-directory: cpa/termux
        run: ./build-release.sh ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: CPA
          path: |
            CPA-v8.0.79.apk
            dist/cpa-termux-arm64.tar.gz
