name: DSH Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（对齐上游 @deepseek-ai/dsh）'
        required: true
        default: 'v0.2.2-rc.5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      # 宿主 Node/npm：npm 装 dsh 到 runtime + node-gyp 交叉编译原生模块
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 注意：不能写 cache: 'npm'。本项目用 npm install --prefix <runtime> 直接装包，
          # 仓库里没有 package-lock.json，setup-node 的 npm 缓存模式会因找不到 lock 文件直接报错。
          # npm 包缓存改用下方自建的 ~/.npm 目录缓存。

      # npm 包缓存（~/.npm 是 npm 默认缓存目录，npm install 会自动命中）
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-dsh-${{ hashFiles('dsh/apk/scripts/build-runtime.sh') }}-${{ github.event.inputs.version }}
          restore-keys: npm-dsh-

      # 缓存 gradle（wrapper + 依赖），避免每次重新下载
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-dsh-${{ hashFiles('dsh/apk/**/gradle-wrapper.properties', 'dsh/apk/**/build.gradle') }}

      # --- APK: 打包 Termux node + dsh 运行时到 assets，再 gradle 编译 Java 壳 ---
      - name: Build APK
        working-directory: dsh/apk
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          # NDK 路径动态检测（供 build-runtime.sh 交叉编译 node-addon-require-builtin）
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | head -1)"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME%/}"
          ./build-apk.sh
      - name: Rename APK
        run: |
          cp dsh/apk/app/build/outputs/apk/release/*.apk "DSH-${{ github.event.inputs.version }}.apk"

      # 构建完直接发布 Release（tag = dsh-<version>）
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="dsh-${VERSION}"
          gh release create "$TAG" "DSH-${VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DSH ${VERSION}" \
            --notes "DSH (DeepSeek Harness) 安卓壳。覆盖安装（adb install -r）保留已解压 runtime。上游 @deepseek-ai/dsh ${VERSION}。" \
            || gh release upload "$TAG" "DSH-${VERSION}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
