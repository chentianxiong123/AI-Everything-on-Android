name: Release (all 6 artifacts)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: { description: 'Release tag (e.g. v2.0.1)', required: true }

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      # ubuntu-latest runners ship with Android SDK preinstalled (ANDROID_HOME).
      # NOTE: android-actions/setup-android@v3 is broken on current runners
      # (sdkmanager fails with "Failed to find package 'tools'"), so we rely on
      # the preinstalled SDK instead.
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x' }
      - uses: oven-sh/setup-bun@v2
      # Pi 需要 Node/npm（npm 装 pi 到 runtime）；不需 NDK（打包现成 Termux node）
      # gradle 用 wrapper 锁定 8.11.1，不需 apt gradle
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with: { ndk-version: r27c }

      - name: Build OneAPI (APK + Termux)
        run: |
          mkdir -p oneapi/apk/app/src/main/jniLibs/arm64-v8a
          curl -fL --retry 3 -o oneapi/apk/app/src/main/jniLibs/arm64-v8a/liboneapi.so \
            https://github.com/songquanpeng/one-api/releases/download/v0.6.10/one-api-arm64
          (cd oneapi/apk && python3 align_fix.py app/src/main/jniLibs/arm64-v8a/liboneapi.so && gradle assembleDebug --no-daemon)
          cp oneapi/apk/app/build/outputs/apk/debug/app-debug.apk OneAPI-v0.6.10.apk
          (cd oneapi/termux && ./build-release.sh)

      - name: Build NewAPI (APK + Termux, static upstream build)
        run: |
          # Official release binary is dynamically linked against glibc -> cannot run on Android.
          # Build a static arm64 binary from the clean upstream tag (same source, CGO_ENABLED=0).
          (cd newapi && ./scripts/build-from-upstream.sh)
          (cd newapi/apk && gradle assembleDebug --no-daemon)
          cp newapi/apk/app/build/outputs/apk/debug/app-debug.apk NewAPI-v1.0.0-rc.15.apk
          (cd newapi/termux && ./build-release.sh)

      - name: Build CPA (APK + Termux)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_CC: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          (cd cpa/apk && ./build-apk.sh)
          cp cpa/apk/CPA-v*.apk CPA-v8.0.79.apk
          (cd cpa/termux && ./build-release.sh)

      - name: Build Pi (APK - Termux node + pi runtime, no NDK)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          (cd pi/apk && ./build-apk.sh)
          cp pi/dist/Pi-latest.apk Pi-latest.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            OneAPI-v0.6.10.apk
            NewAPI-v1.0.0-rc.15.apk
            CPA-v8.0.79.apk
            Pi-latest.apk
            oneapi/oneapi-termux-arm64.tar.gz
            newapi/newapi-termux-arm64.tar.gz
            cpa/cpa-termux-arm64.tar.gz
