name: Pi Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（对齐上游 @agegr/pi-web）'
        required: true
        default: 'v0.18.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'                    # 缓存 npm 包（pi-web 依赖）

      # 缓存 gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-pi-${{ hashFiles('pi/apk/**/gradle-wrapper.properties', 'pi/apk/**/build.gradle') }}

      # --- APK: 打包 Termux node + pi 运行时到 assets，再 gradle 编译 Java 壳 ---
      - name: Build APK
        working-directory: pi/apk
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./build-apk.sh

      - name: Rename APK
        run: |
          cp pi/apk/app/build/outputs/apk/release/*.apk "Pi-${{ github.event.inputs.version }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="pi-${VERSION}"
          gh release create "$TAG" "Pi-${VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pi Runner ${VERSION}" \
            --notes "Pi 安卓壳。上游 @agegr/pi-web ${VERSION}。" \
            || gh release upload "$TAG" "Pi-${VERSION}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
