name: NewAPI Build (APK + Termux)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['newapi/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: oven-sh/setup-bun@v2

      - name: Fetch official binary -> APK payload (new package name)
        working-directory: newapi/apk
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fL --retry 3 -o app/src/main/jniLibs/arm64-v8a/libnewapi.so \
            https://github.com/QuantumNous/new-api/releases/download/v1.0.0-rc.15/new-api-arm64-v1.0.0-rc.15
      - name: Build APK
        working-directory: newapi/apk
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp newapi/apk/app/build/outputs/apk/debug/app-debug.apk NewAPI-v1.0.0-rc.15.apk

      - name: Build Termux tarball
        working-directory: newapi/termux
        run: ./build-release.sh ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: NewAPI
          path: |
            NewAPI-v1.0.0-rc.15.apk
            dist/newapi-termux-arm64.tar.gz
