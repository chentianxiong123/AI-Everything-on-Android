name: OneAPI Build (APK + Termux)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['oneapi/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - uses: android-actions/setup-android@v3

      - name: Fetch official binary -> APK payload
        working-directory: oneapi/apk
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fL --retry 3 -o app/src/main/jniLibs/arm64-v8a/liboneapi.so \
            https://github.com/songquanpeng/one-api/releases/download/v0.6.10/one-api-arm64
          python3 align_fix.py app/src/main/jniLibs/arm64-v8a/liboneapi.so
      - name: Build APK
        working-directory: oneapi/apk
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp oneapi/apk/app/build/outputs/apk/debug/app-debug.apk OneAPI-v0.6.10.apk

      - name: Build Termux tarball
        working-directory: oneapi/termux
        run: ./build-release.sh ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: OneAPI
          path: |
            OneAPI-v0.6.10.apk
            dist/oneapi-termux-arm64.tar.gz
